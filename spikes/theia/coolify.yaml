# Coolify: Docker Compose build pack, Base Directory `/`, Docker Compose
# Location `/spikes/theia/coolify.yaml`. See README "Deploy on Coolify".
#
# Only `gateway` gets a domain. It enforces HTTP basic auth and is the sole
# route to Theia and the collaboration server, which publish no ports and get
# no domain. Nothing here uses `ports:`.
services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      # Coolify generates the public URL and routes it to port 80 here.
      SERVICE_URL_GATEWAY_80: /
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-whiteboard}
      # Generated by Coolify on first deploy; shown under Environment Variables.
      BASIC_AUTH_PASSWORD: ${SERVICE_PASSWORD_BASICAUTH}
    depends_on:
      - whiteboard
      - collaboration
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  whiteboard:
    build:
      context: ../..
      dockerfile: spikes/theia/Dockerfile
    environment:
      # Same origin as the page, under the gateway's /oct prefix.
      COLLABORATION_SERVER_URL: /oct
      # Space-separated git URLs cloned into /workspace on first start.
      WHITEBOARD_CLONE_URLS: ${WHITEBOARD_CLONE_URLS:-https://github.com/dhx/whiteboard.git}
    volumes:
      - whiteboard-data:/data
      - whiteboard-workspace:/workspace
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  collaboration:
    build:
      context: .
      dockerfile: oct-server/Dockerfile
    environment:
      OCT_JWT_PRIVATE_KEY: ${SERVICE_HEX_64_OCTJWT}
      # Derives OCT_BASE_URL (<url>/oct) and the allowed CORS origin.
      WHITEBOARD_PUBLIC_URL: ${SERVICE_URL_GATEWAY_80}
      # Names are unverified; the gateway's basic auth is what keeps others
      # out, and the session host approves each guest.
      OCT_ACTIVATE_SIMPLE_LOGIN: "true"
    restart: unless-stopped

volumes:
  whiteboard-data:
  whiteboard-workspace:
